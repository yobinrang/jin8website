<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jin 8 — IG First Post Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+SC:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --crimson: #8B0000;
    --crimson-deep: #4a0202;
    --crimson-oxblood: #2c0808;
    --cream: #FAF0C8;
    --gold: #D4A02E;
    --gold-bright: #F2C94C;
    --gold-deep: #B07F1A;
  }
  body { margin: 0; font-family: 'EB Garamond', serif; background: #1a0808; color: var(--cream); }

  /* ── IG Post (1080x1350 → scaled) ── */
  .ig {
    width: 540px;
    height: 675px;
    position: relative;
    overflow: hidden;
    background: #0d0303;
    flex-shrink: 0;
  }

  /* ──── 01 Photo + Textured Logo ──── */
  .ig-01 .bg {
    position: absolute; inset: 0;
    background: url('assets/ig-bar-scene.png') center/cover no-repeat;
  }
  .ig-01 .bg::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 65%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.55) 100%);
  }
  .ig-01 .logo {
    position: absolute;
    left: 50%; top: 60%;
    transform: translate(-50%, -50%);
    width: 152px; height: 242px;
    background: url('assets/jin8-logo-ig.png') center/contain no-repeat;
    filter:
      drop-shadow(0 0 24px rgba(255,200,100,0.45))
      drop-shadow(0 4px 16px rgba(0,0,0,0.6));
  }
  .ig-01 .meta {
    position: absolute;
    bottom: 36px; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 44px;
    font-family: 'Cormorant SC', serif;
    font-size: 11px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: #F2C94C;
  }

  /* ──── 02 Editorial Type-Led ──── */
  .ig-02 {
    background: var(--crimson-oxblood);
  }
  .ig-02 .photo {
    position: absolute;
    top: 76px; left: 50%;
    transform: translateX(-50%);
    width: 380px; height: 280px;
    background: url('assets/ig-bar-scene.png') center/cover;
    filter: saturate(0.9) contrast(1.05);
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
  }
  .ig-02 .photo::after {
    content: ''; position: absolute; inset: 0;
    border: 1px solid rgba(212, 160, 46, 0.4);
    pointer-events: none;
  }
  .ig-02 .word {
    position: absolute;
    top: 386px; left: 0; right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 152px;
    line-height: 0.9;
    background: linear-gradient(180deg, #FFE08A 0%, #D49E1E 50%, #8E6310 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.02em;
  }
  .ig-02 .word em {
    font-style: italic;
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
  }
  .ig-02 .rule {
    position: absolute;
    top: 538px; left: 50%;
    transform: translateX(-50%);
    width: 56px; height: 1px;
    background: var(--gold);
    opacity: 0.5;
  }
  .ig-02 .tag {
    position: absolute;
    top: 558px; left: 0; right: 0;
    text-align: center;
    font-family: 'Cormorant SC', serif;
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .ig-02 .footer {
    position: absolute;
    bottom: 36px; left: 0; right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--cream);
    opacity: 0.7;
  }

  /* ──── 03 Solid Crimson + Foil Logo ──── */
  .ig-03 {
    background:
      radial-gradient(ellipse at center, #5a0a0a 0%, #2a0606 100%);
  }
  .ig-03::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(212,160,46,0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(212,160,46,0.06) 0%, transparent 40%);
  }
  .ig-03 .frame {
    position: absolute; inset: 28px;
    border: 1px solid rgba(212, 160, 46, 0.35);
  }
  .ig-03 .frame::after {
    content: ''; position: absolute; inset: 8px;
    border: 1px solid rgba(212, 160, 46, 0.15);
  }
  .ig-03 .top {
    position: absolute;
    top: 80px; left: 0; right: 0;
    text-align: center;
    font-family: 'Cormorant SC', serif;
    font-size: 12px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
  }
  .ig-03 .logo {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 200px; height: 318px;
    background: url('assets/jin8-logo-ig.png') center/contain no-repeat;
    filter: drop-shadow(0 0 36px rgba(255,200,100,0.32)) drop-shadow(0 8px 28px rgba(0,0,0,0.5));
  }
  .ig-03 .bottom {
    position: absolute;
    bottom: 90px; left: 0; right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--cream);
    opacity: 0.75;
    letter-spacing: 0.02em;
  }
  .ig-03 .meta {
    position: absolute;
    bottom: 56px; left: 0; right: 0;
    text-align: center;
    font-family: 'Cormorant SC', serif;
    font-size: 10px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.6;
  }

  /* ──── 04 Photo + Foil Strip ──── */
  .ig-04 .bg {
    position: absolute; top: 0; left: 0; right: 0; height: 75%;
    background: url('assets/ig-bar-scene.png') center/cover no-repeat;
  }
  .ig-04 .bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 40%, rgba(28,4,4,0.85) 100%);
  }
  .ig-04 .strip {
    position: absolute; bottom: 0; left: 0; right: 0; height: 25%;
    background: var(--crimson-oxblood);
    border-top: 1px solid rgba(212, 160, 46, 0.45);
    display: flex;
    align-items: center;
    padding: 0 44px;
    gap: 24px;
  }
  .ig-04 .strip-logo {
    width: 56px; height: 90px;
    background: url('assets/jin8-logo-ig.png') center/contain no-repeat;
    flex-shrink: 0;
  }
  .ig-04 .strip-text {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ig-04 .strip-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    color: var(--gold);
    letter-spacing: 0.05em;
    line-height: 1;
  }
  .ig-04 .strip-name em { font-style: italic; }
  .ig-04 .strip-tag {
    font-family: 'Cormorant SC', serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.7;
  }
  .ig-04 .strip-soon {
    margin-left: auto;
    font-family: 'Cormorant SC', serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: right;
    line-height: 1.6;
  }

  /* ──── 05 Kanji-led ──── */
  .ig-05 {
    background:
      radial-gradient(ellipse at center, #3a0808 0%, #1a0404 100%);
    overflow: hidden;
  }
  .ig-05 .photo {
    position: absolute;
    inset: 0;
    background: url('assets/ig-bar-scene.png') center/cover;
    opacity: 0.32;
    filter: saturate(0.7) contrast(1.1);
    mix-blend-mode: lighten;
  }
  .ig-05 .scrim {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(40,8,8,0.4) 0%, rgba(20,4,4,0.85) 100%);
  }
  .ig-05 .jin {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -55%);
    font-family: 'Noto Serif SC', serif;
    font-size: 380px;
    font-weight: 300;
    line-height: 1;
    color: transparent;
    background: linear-gradient(180deg, #FFE08A 0%, #D49E1E 55%, #8E6310 100%);
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 44px rgba(255,200,100,0.3));
  }
  .ig-05 .pinyin {
    position: absolute;
    left: 50%; top: 78%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--cream);
    opacity: 0.75;
  }
  .ig-05 .tag {
    position: absolute;
    bottom: 88px; left: 0; right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 38px;
    line-height: 1.2;
    color: var(--cream);
    opacity: 0.9;
  }
  .ig-05 .meta {
    position: absolute;
    bottom: 36px; left: 0; right: 0;
    text-align: center;
    font-family: 'Cormorant SC', serif;
    font-size: 11px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
  }

  /* ──── 06 Quiet Door — minimal photo crop ──── */
  .ig-06 {
    background: #100404;
  }
  .ig-06 .photo {
    position: absolute;
    top: 60px; left: 60px; right: 60px; bottom: 200px;
    background: url('assets/ig-bar-scene.png') center 30%/cover no-repeat;
  }
  .ig-06 .photo::after {
    content: '';
    position: absolute; inset: 0;
    border: 1px solid rgba(212, 160, 46, 0.5);
  }
  .ig-06 .photo::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.45) 100%);
  }
  .ig-06 .corner-logo {
    position: absolute;
    left: 60px;
    top: 60px;
    width: 36px; height: 58px;
    background: url('assets/jin8-logo-ig.png') center/contain no-repeat;
    z-index: 2;
  }
  .ig-06 .corner-tag {
    position: absolute;
    right: 60px;
    top: 78px;
    font-family: 'Cormorant SC', serif;
    font-size: 10px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
    z-index: 2;
  }
  .ig-06 .copy {
    position: absolute;
    bottom: 60px; left: 60px; right: 60px;
    text-align: left;
  }
  .ig-06 .copy-line1 {
    font-family: 'Cormorant SC', serif;
    font-size: 11px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    opacity: 0.8;
  }
  .ig-06 .copy-line2 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 36px;
    line-height: 1.15;
    color: var(--cream);
    margin-bottom: 18px;
    letter-spacing: -0.005em;
  }
  .ig-06 .copy-line2 em {
    font-family: 'Noto Serif SC', serif;
    font-style: normal;
    color: var(--gold);
  }
  .ig-06 .copy-meta {
    font-family: 'Cormorant SC', serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.5;
  }

  /* ── Recommendations panel ── */
  .recs {
    background: #2a0606;
    color: var(--cream);
    padding: 56px 64px;
    font-family: 'EB Garamond', serif;
    line-height: 1.65;
  }
  .recs h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 28px;
    color: var(--gold);
    margin: 0 0 20px;
    letter-spacing: -0.005em;
  }
  .recs h3 em { font-style: italic; }
  .recs h4 {
    font-family: 'Cormorant SC', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 28px 0 8px;
    opacity: 0.85;
  }
  .recs p {
    font-size: 16px;
    margin: 0 0 12px;
    color: var(--cream);
    opacity: 0.85;
    max-width: 720px;
  }
  .recs ul {
    margin: 0 0 14px;
    padding-left: 20px;
    max-width: 720px;
  }
  .recs li {
    font-size: 15px;
    margin-bottom: 6px;
    color: var(--cream);
    opacity: 0.82;
  }
  .recs em { color: var(--gold); font-style: italic; }
  .recs strong { color: var(--gold-bright); font-weight: 400; }

  /* DC overrides for tighter labels */
  dc-artboard {
    --dc-label-color: var(--cream);
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="Jin 8 — IG First Post Concepts" subtitle="Six directions + recommendations on logo treatment">
        <DCSection id="recs" title="Why your post looked flat — and what to do">
          <DCArtboard id="rec" label="Diagnosis & approach" width={1080} height={900}>
            <div className="recs" style={{width: 1080, height: 900, boxSizing: 'border-box'}}>
              <h3>The brushed-gold logo went <em>flat</em> on Instagram</h3>
              <p>A few things conspire on social: <strong>JPEG compression</strong> kills subtle metallic gradients, <strong>small display sizes</strong> hide texture, and <strong>busy photo backdrops</strong> dilute soft brush edges. The flat warm-cream you're seeing is the brush-stroke alpha being read as semi-transparent — so the gold gets washed out by whatever's behind.</p>

              <h4>Three fixes — pick whichever fits the post</h4>
              <ul>
                <li><strong>Bake the texture into the PNG.</strong> Don't rely on CSS-mask or live texture overlays for export. The new <em>jin8-logo-ig.png</em> in this project has a sharpened-alpha + vertical gold gradient + diagonal sheen baked in. Use this asset everywhere except the live website.</li>
                <li><strong>Anchor the logo with a darker plate or scrim.</strong> Photos with warm highlights (lanterns, candlelight) compete with gold. A subtle radial shadow under the logo, or a solid frame strip, restores contrast.</li>
                <li><strong>Use bigger gold area.</strong> Texture only reads when there's enough surface — a 60-pixel logo will compress to mush. Keep the seal at <em>least 200px wide</em> on a 1080-wide post, or pair with a large wordmark.</li>
              </ul>

              <h4>Don't insist on textured gold for every post</h4>
              <p>For small thumbnails or busy photos, a <strong>flat warm cream</strong> (#FAF0C8) or solid <strong>imperial gold</strong> (#D4A02E) reads cleaner than dilute texture. Save the brushed treatment for hero moments — opening announcement, quote tiles, brand carousel covers.</p>

              <h4>Six post directions — drag any to fullscreen</h4>
              <p>Mix and match across the feed: photo-led for atmosphere, type-led for announcements, kanji-led for cultural anchor. All use the same six elements (logo, photo, gold, crimson, type, kanji) so the grid still feels cohesive.</p>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="posts" title="Six first-post directions">

          <DCArtboard id="ig-01" label="01 — Photo + textured logo (your version, refined)" width={540} height={675}>
            <div className="ig ig-01">
              <div className="bg" />
              <div className="logo" />
              <div className="meta">
                <span>Cocktail Bar</span>
                <span>Coming Soon</span>
                <span>Box Hill · VIC</span>
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id="ig-02" label="02 — Editorial: photo as plate, type leads" width={540} height={675}>
            <div className="ig ig-02">
              <div className="photo" />
              <div className="word">Jin <em>8</em></div>
              <div className="rule" />
              <div className="tag">A Cocktail Bar · Coming Soon</div>
              <div className="footer">Box Hill · Autumn 2026</div>
            </div>
          </DCArtboard>

          <DCArtboard id="ig-03" label="03 — Solid crimson + framed foil seal" width={540} height={675}>
            <div className="ig ig-03">
              <div className="frame" />
              <div className="top">An Invitation</div>
              <div className="logo" />
              <div className="bottom">A quiet door, opening soon.</div>
              <div className="meta">Box Hill · VIC</div>
            </div>
          </DCArtboard>

          <DCArtboard id="ig-04" label="04 — Photo with foil strip & wordmark" width={540} height={675}>
            <div className="ig ig-04">
              <div className="bg" />
              <div className="strip">
                <div className="strip-logo" />
                <div className="strip-text">
                  <div className="strip-name">Jin <em>8</em></div>
                  <div className="strip-tag">Shanxi Cocktail Bar</div>
                </div>
                <div className="strip-soon">
                  Box Hill<br/>Coming Soon
                </div>
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id="ig-05" label="05 — Kanji-led: 晋 dominant, photo recedes" width={540} height={675}>
            <div className="ig ig-05">
              <div className="photo" />
              <div className="scrim" />
              <div className="jin">晋</div>
              <div className="pinyin">jìn · the heart of Shanxi</div>
              <div className="tag">A cocktail bar,<br/>opening soon.</div>
              <div className="meta">Jin 8 · Box Hill</div>
            </div>
          </DCArtboard>

          <DCArtboard id="ig-06" label="06 — Quiet editorial: framed photo, corner mark" width={540} height={675}>
            <div className="ig ig-06">
              <div className="corner-logo" />
              <div className="corner-tag">Jin 8</div>
              <div className="photo" />
              <div className="copy">
                <div className="copy-line1">An ode to the merchants of old</div>
                <div className="copy-line2">Rooted in <em>晋</em>,<br/>poured in Box Hill.</div>
                <div className="copy-meta">Cocktail Bar · Coming Soon</div>
              </div>
            </div>
          </DCArtboard>

        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
