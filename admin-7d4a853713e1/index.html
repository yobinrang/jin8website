<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jin 8 — Guest List</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="512x512" href="../assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Cormorant+SC:wght@400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --cream: #FAF0C8; --gold: #C9A961; --rule: rgba(201,169,97,0.18); }
  body { background: #2a0606; color: var(--cream); font-family: 'EB Garamond', serif; min-height: 100vh; }
  .page { max-width: 820px; margin: 0 auto; padding: 48px 20px 80px; }
  [hidden] { display: none !important; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 34px; letter-spacing: -0.01em; }
  h1 em { font-style: italic; color: var(--gold); }
  .sub { font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); opacity: 0.8; margin-top: 8px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 28px 0 22px; }
  input[type=password] { background: transparent; border: none; border-bottom: 1px solid rgba(250,240,200,0.25); padding: 9px 2px; color: var(--cream); font-family: 'EB Garamond', serif; font-size: 16px; outline: none; min-width: 260px; border-radius: 0; }
  input:focus { border-color: var(--gold); }
  button { background: transparent; color: var(--cream); border: 1px solid var(--gold); padding: 9px 18px; font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; cursor: pointer; border-radius: 0; transition: all 0.25s; }
  button:hover { background: var(--gold); color: #2a0606; }
  button.quiet { border-color: rgba(201,169,97,0.35); opacity: 0.7; }
  button.danger:hover { background: #8B0000; border-color: #8B0000; color: var(--cream); }
  .msg { font-style: italic; opacity: 0.7; margin: 10px 0; }
  .msg.err { color: #E8B4A0; }
  .count { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin: 8px 0 18px; }
  .count em { color: var(--gold); font-style: italic; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 10px 12px 0; border-bottom: 1px solid var(--rule); vertical-align: top; font-size: 15px; }
  th { font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); opacity: 0.8; font-weight: 400; }
  td.n { font-family: 'Cormorant Garamond', serif; font-size: 19px; }
  td.p { white-space: nowrap; }
  td.t { opacity: 0.6; font-size: 13.5px; white-space: nowrap; }
  td.a { text-align: right; }
  td.a button { padding: 5px 10px; font-size: 9px; }
  @media (max-width: 640px) { td.t.last { display: none; } th.last { display: none; } }
</style>
</head>
<body>
<div class="page">
  <h1>Soft Opening <em>Guest List</em></h1>
  <p class="sub">Jin 8 · Thursday 24 September</p>

  <div class="bar">
    <input id="key" type="password" placeholder="Admin key" autocomplete="off">
    <button id="load">Load</button>
    <button id="csv" class="quiet" hidden>Copy CSV</button>
    <button id="forget" class="quiet" hidden>Forget key</button>
  </div>
  <p class="msg" id="msg" hidden></p>

  <div id="out" hidden>
    <p class="count"><em id="count">0</em> registered</p>
    <table>
      <thead><tr><th>Name</th><th>Mobile</th><th>Registered</th><th class="last">Last seen</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var keyInput = $('key'), msg = $('msg'), out = $('out'), rows = $('rows');
  var data = [];

  try { var saved = sessionStorage.getItem('jin8_admin_key'); if (saved) keyInput.value = saved; } catch (e) {}

  function note(text, isErr) { msg.textContent = text; msg.classList.toggle('err', !!isErr); msg.hidden = !text; }
  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleString('en-AU', { timeZone: 'Australia/Melbourne', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  }
  function key() { return keyInput.value.trim(); }

  function load() {
    var k = key();
    if (!k) { note('Enter the admin key.', true); return; }
    note('Loading…');
    fetch('/api/admin', { headers: { 'x-admin-key': k }, cache: 'no-store' })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (res) {
        if (!res.ok) { note(res.body.error || 'Unauthorised.', true); out.hidden = true; return; }
        try { sessionStorage.setItem('jin8_admin_key', k); } catch (e) {}
        data = res.body.registrations || [];
        render();
        note('');
        $('csv').hidden = false; $('forget').hidden = false; out.hidden = false;
      })
      .catch(function () { note('Could not reach the server.', true); });
  }

  function render() {
    $('count').textContent = data.length;
    rows.textContent = '';
    data.forEach(function (r) {
      var tr = document.createElement('tr');
      function td(cls, text) { var c = document.createElement('td'); if (cls) c.className = cls; c.textContent = text; tr.appendChild(c); return c; }
      td('n', r.name);
      td('p', r.phonePretty || r.phone);
      td('t', fmt(r.createdAt));
      td('t last', fmt(r.lastLogin) + (r.logins > 1 ? ' · ' + r.logins + '×' : ''));
      var a = td('a', '');
      var del = document.createElement('button'); del.className = 'quiet danger'; del.textContent = 'Remove';
      del.addEventListener('click', function () {
        if (!confirm('Remove ' + r.name + ' (' + (r.phonePretty || r.phone) + ')? They can register again.')) return;
        fetch('/api/admin?phone=' + encodeURIComponent(r.phone), { method: 'DELETE', headers: { 'x-admin-key': key() } })
          .then(function (res) { if (res.ok) load(); else note('Could not remove.', true); });
      });
      a.appendChild(del);
      rows.appendChild(tr);
    });
  }

  $('load').addEventListener('click', load);
  keyInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
  $('forget').addEventListener('click', function () { try { sessionStorage.removeItem('jin8_admin_key'); } catch (e) {} keyInput.value = ''; out.hidden = true; $('csv').hidden = true; $('forget').hidden = true; note('Key forgotten.'); });
  $('csv').addEventListener('click', function () {
    var lines = [['Name', 'Mobile', 'Registered', 'Last seen', 'Logins']].concat(
      data.map(function (r) { return [r.name, r.phone, r.createdAt, r.lastLogin, r.logins]; })
    ).map(function (row) { return row.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    navigator.clipboard.writeText(lines).then(function () { note('Copied ' + data.length + ' rows as CSV.'); }, function () { note('Copy failed — select the table and copy manually.', true); });
  });

  if (keyInput.value) load();
})();
</script>
</body>
</html>
