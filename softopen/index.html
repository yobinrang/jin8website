<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jin 8 — You’re Invited</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2a0606">
<link rel="icon" type="image/png" sizes="512x512" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cormorant+SC:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --crimson: #8B0000;
    --crimson-deep: #4a0202;
    --cream: #FAF0C8;
    --ink: #160606;
    --gold: #C9A961;
    --rule: rgba(201, 169, 97, 0.18);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: #2a0606;
    color: var(--cream);
    font-family: 'EB Garamond', serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.05; pointer-events: none; z-index: 100; mix-blend-mode: overlay;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(139, 0, 0, 0.45) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(74, 2, 2, 0.6) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 56px 24px 72px; }
  [hidden] { display: none !important; }

  /* ── HEADER ── */
  .head { text-align: center; margin-bottom: 44px; animation: fadeUp 1.2s var(--ease) both; }
  .logo {
    width: 84px; height: auto; display: block; margin: 0 auto 28px;
    filter: drop-shadow(0 0 18px rgba(255, 200, 100, 0.28)) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45));
  }
  .kicker {
    font-family: 'Cormorant SC', serif; font-size: 11px; letter-spacing: 0.45em; text-transform: uppercase;
    color: var(--gold); opacity: 0.85; display: inline-flex; align-items: center; gap: 14px; margin-bottom: 18px;
  }
  .kicker::before, .kicker::after { content: ''; width: 20px; height: 1px; background: var(--gold); opacity: 0.5; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(40px, 11vw, 56px); font-weight: 300; line-height: 1; letter-spacing: -0.015em; color: var(--cream); }
  h1 em { font-style: italic; color: var(--gold); font-weight: 300; }
  .when { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: var(--cream); opacity: 0.75; margin-top: 16px; }

  /* ── LOADING ── */
  .loading { text-align: center; font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); opacity: 0.5; padding: 40px 0; }

  /* ── GATE ── */
  .gate { animation: fadeUp 0.8s var(--ease) both; }
  .gate-lede { text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; line-height: 1.5; opacity: 0.75; max-width: 400px; margin: 0 auto 28px; min-height: 1.5em; }
  .gate form { display: flex; flex-direction: column; gap: 18px; max-width: 400px; margin: 0 auto; }
  .step { display: flex; flex-direction: column; gap: 18px; animation: fadeUp 0.5s var(--ease) both; }
  label { display: block; }
  .lbl { display: block; font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); opacity: 0.75; margin-bottom: 4px; }
  input, textarea {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(250,240,200,0.25);
    padding: 10px 2px; color: var(--cream); font-family: 'EB Garamond', serif; font-size: 18px; outline: none;
    transition: border-color 0.3s; border-radius: 0; letter-spacing: 0.02em;
  }
  input::placeholder, textarea::placeholder { color: rgba(250,240,200,0.35); font-style: italic; letter-spacing: 0; }
  input:focus, textarea:focus { border-color: var(--gold); }
  textarea { font-size: 16px; line-height: 1.5; resize: vertical; min-height: 64px; }
  .hint { font-size: 12.5px; font-style: italic; opacity: 0.45; margin-top: 6px; min-height: 1em; }
  .phone-echo { text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.02em; margin-bottom: 2px; }
  .phone-echo .link {
    background: none; border: none; color: var(--gold); cursor: pointer; padding: 0; margin-left: 12px;
    font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    border-bottom: 1px solid transparent; transition: border-color 0.25s; vertical-align: middle;
  }
  .phone-echo .link:hover { border-bottom-color: var(--gold); }
  .btn {
    margin: 10px auto 0; padding: 13px 34px; font-family: 'Cormorant SC', serif; font-size: 11px; letter-spacing: 0.32em;
    text-transform: uppercase; background: transparent; color: var(--cream); border: 1px solid var(--gold);
    cursor: pointer; transition: all 0.3s; border-radius: 0; min-width: 160px; display: block;
  }
  .btn:hover { background: var(--gold); color: #2a0606; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .err { text-align: center; color: #E8B4A0; font-style: italic; font-size: 14.5px; line-height: 1.5; padding: 4px 0; }
  .gate-fine { text-align: center; font-size: 12.5px; font-style: italic; opacity: 0.4; margin-top: 26px; line-height: 1.55; min-height: 1.5em; }

  /* ── INSIDE ── */
  .inside { animation: fadeUp 0.9s var(--ease) both; }
  .welcome { text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; margin-bottom: 40px; }
  .welcome em { font-style: italic; color: var(--gold); }

  section { margin-bottom: 56px; }
  .section-head { text-align: center; margin-bottom: 26px; }
  .section-label {
    font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold);
    opacity: 0.85; display: inline-flex; align-items: center; gap: 12px; margin-bottom: 10px;
  }
  .section-label::before, .section-label::after { content: ''; width: 18px; height: 1px; background: var(--gold); opacity: 0.5; }
  .section-head h2 { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 300; line-height: 1.05; letter-spacing: -0.01em; color: var(--cream); }
  .section-head h2 em { font-style: italic; color: var(--gold); }
  .section-head .sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; opacity: 0.6; margin-top: 8px; }

  /* Event */
  .intro { text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.5; opacity: 0.85; max-width: 440px; margin: 0 auto 30px; }
  .details { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .detail { display: flex; gap: 18px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .detail:last-child { border-bottom: none; }
  .detail .k { flex: 0 0 82px; font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); opacity: 0.75; }
  .detail .v { font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.3; }
  .detail .v a { color: var(--cream); text-decoration: none; border-bottom: 1px solid rgba(201,169,97,0.4); transition: border-color 0.25s, color 0.25s; }
  .detail .v a:hover { color: var(--gold); border-bottom-color: var(--gold); }
  .notes { list-style: none; counter-reset: n; margin-top: 26px; }
  .notes li { counter-increment: n; position: relative; padding: 10px 0 10px 32px; font-size: 15.5px; line-height: 1.6; opacity: 0.8; }
  .notes li::before {
    content: counter(n); position: absolute; left: 0; top: 10px;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: var(--gold); opacity: 0.85; line-height: 1.45;
  }

  /* About */
  .about-body { text-align: center; font-size: 17px; line-height: 1.75; opacity: 0.82; max-width: 460px; margin: 0 auto; }

  /* ── ACCORDION (menu lists + feedback) ── */
  .acc-list { border-top: 1px solid var(--rule); }
  .acc { border-bottom: 1px solid var(--rule); scroll-margin-top: 18px; }
  .acc-btn {
    width: 100%; background: none; border: none; color: inherit; text-align: left; cursor: pointer; font-family: inherit;
    padding: 24px 0; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "label icon" "title icon" "sub icon";
    align-items: center; column-gap: 18px; -webkit-tap-highlight-color: transparent;
  }
  .acc-label { grid-area: label; font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); opacity: 0.8; margin-bottom: 6px; }
  .acc-title { grid-area: title; font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; line-height: 1.05; letter-spacing: -0.01em; color: var(--cream); }
  .acc-title em { font-style: italic; color: var(--gold); }
  .acc-sub { grid-area: sub; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; opacity: 0.6; margin-top: 6px; }
  .acc-icon {
    grid-area: icon; width: 40px; height: 40px; border: 1px solid rgba(201,169,97,0.4); border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; line-height: 1; color: var(--gold);
    transition: transform 0.5s var(--ease), background 0.3s, color 0.3s;
  }
  .acc-btn:hover .acc-icon { background: rgba(201,169,97,0.12); }
  .acc.open .acc-icon { transform: rotate(45deg); background: var(--gold); color: #2a0606; }
  .acc-panel { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.6s var(--ease), opacity 0.45s ease; }
  .acc.open .acc-panel { grid-template-rows: 1fr; opacity: 1; }
  .acc-inner { overflow: hidden; min-height: 0; }
  .acc-inner .items { border-top: 1px solid var(--rule); margin-bottom: 10px; }
  .acc-inner .item:last-child { border-bottom: none; }
  .acc-inner .placeholder { border-top: 1px solid var(--rule); padding: 22px 0 26px; }
  .placeholder { text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; line-height: 1.55; opacity: 0.55; }
  .menu-note {
    display: block; width: max-content; max-width: 100%; margin: 16px auto 0; padding: 9px 16px;
    font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--gold); border: 1px solid rgba(201,169,97,0.4); border-radius: 2px; text-align: center; line-height: 1.5;
  }
  .group-title {
    font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold); opacity: 0.8; padding: 22px 0 4px; border-top: 1px solid var(--rule);
  }
  .acc-inner .group-title + .items { border-top: none; }

  /* Items (used once the menu is revealed) */
  .items { list-style: none; }
  .item { padding: 22px 0 20px; border-bottom: 1px solid var(--rule); }
  .item-row { display: flex; align-items: baseline; gap: 14px; }
  .num { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; letter-spacing: 0.1em; opacity: 0.4; flex: 0 0 auto; min-width: 20px; }
  .name { font-family: 'Cormorant Garamond', serif; font-size: 23px; font-weight: 400; line-height: 1.15; letter-spacing: -0.005em; flex: 1 1 auto; }
  .name em { font-style: italic; color: var(--gold); }
  .price { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--gold); opacity: 0.9; flex: 0 0 auto; white-space: nowrap; margin-left: 12px; min-width: 2.2em; text-align: right; }
  .price.ph { opacity: 0.3; }
  .cn { margin-top: 5px; padding-left: 34px; display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; color: var(--gold); }
  .cn .hanzi { font-family: 'Noto Serif SC', serif; font-weight: 400; font-size: 17px; letter-spacing: 0.1em; }
  .cn .pinyin { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15.5px; opacity: 0.75; }
  .tag { margin-top: 11px; padding-left: 34px; font-family: 'Cormorant SC', serif; font-size: 9.5px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); opacity: 0.6; }
  .desc { margin-top: 6px; padding-left: 34px; font-size: 15px; line-height: 1.62; opacity: 0.72; }
  .pour { font-size: 14.5px; line-height: 1.55; font-style: italic; opacity: 0.62; margin-top: 7px; padding-left: 34px; }
  .strength { margin-top: 9px; padding-left: 34px; font-family: 'Cormorant SC', serif; font-size: 9.5px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); opacity: 0.55; }
  .items.plain .cn, .items.plain .tag, .items.plain .desc, .items.plain .pour, .items.plain .strength { padding-left: 0; }

  /* Feedback form */
  .fb-form { padding: 6px 0 26px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
  .fb-area { border: none; padding: 20px 0 6px; }
  .fb-area + .fb-area, .fb-other { border-top: 1px solid var(--rule); }
  .fb-other { padding: 20px 0 6px; }
  .fb-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; line-height: 1.15; }
  .fb-sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14.5px; opacity: 0.6; margin-top: 3px; }
  .rating { display: flex; gap: 10px; margin: 14px 0 6px; }
  .rate {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(201,169,97,0.4); background: none; color: var(--gold);
    font-family: 'Cormorant Garamond', serif; font-size: 18px; cursor: pointer; transition: background 0.25s, color 0.25s, border-color 0.25s;
    -webkit-tap-highlight-color: transparent;
  }
  .rate:hover { background: rgba(201,169,97,0.12); }
  .rate.on { background: var(--gold); color: #2a0606; border-color: var(--gold); }
  .rating-hint { font-family: 'Cormorant SC', serif; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); opacity: 0.45; margin-bottom: 4px; }
  .fb-thanks { text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: var(--gold); padding: 26px 0 8px; border-top: 1px solid var(--rule); }
  .fb-again { display: block; margin: 12px auto 22px; background: none; border: none; color: var(--cream); opacity: 0.5; cursor: pointer; font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; border-bottom: 1px solid transparent; }
  .fb-again:hover { opacity: 1; color: var(--gold); border-bottom-color: var(--gold); }

  /* Footer */
  .foot { text-align: center; padding-top: 24px; border-top: 1px solid var(--rule); }
  .foot .addr { font-size: 13px; font-style: italic; opacity: 0.4; line-height: 1.6; }
  .foot-links { display: flex; justify-content: center; gap: 22px; margin-top: 16px; flex-wrap: wrap; }
  .foot a, .foot button {
    color: var(--cream); background: none; border: none; text-decoration: none; opacity: 0.55; cursor: pointer;
    font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    border-bottom: 1px solid transparent; padding: 0; transition: color 0.25s, opacity 0.25s, border-color 0.25s;
  }
  .foot a:hover, .foot button:hover { color: var(--gold); opacity: 1; border-bottom-color: var(--gold); }
  .foot .admin { opacity: 0.3; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .acc-panel, .acc-icon, .head, .gate, .inside, .step { transition: none; animation: none; }
  }

  @media (min-width: 600px) {
    .page { padding: 80px 32px 96px; }
    .name { font-size: 25px; }
    .detail .k { flex-basis: 96px; }
    .acc-title { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="head">
    <img class="logo" src="../assets/jin8-logo-royal.png" alt="Jin 8">
    <div class="kicker" id="kicker">You’re invited</div>
    <h1>Soft <em>Opening</em></h1>
    <p class="when" id="when"></p>
    <script>
      // One page, two nights: /softopen is Thursday, /softopen_sat is Saturday.
      (function () {
        var nights = {
          thu: 'Thursday 24 September · from 7pm',
          sat: 'Saturday 26 September · from 7pm'
        };
        var ev = /^\/softopen_sat(\/|$)/.test(location.pathname) ? 'sat' : 'thu';
        window.JIN8_EVENT = ev;
        document.getElementById('when').textContent = nights[ev];
      })();
    </script>
  </header>

  <div class="loading" id="loading">Opening the door…</div>

  <!-- ══ GATE ══ -->
  <section class="gate" id="gate" hidden>
    <p class="gate-lede" id="gate-lede">Enter your mobile number and we’ll open the door.</p>

    <form id="gate-form" novalidate autocomplete="on">
      <div class="step" id="step-phone">
        <label>
          <span class="lbl">Mobile number</span>
          <input name="phone" id="in-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="04xx xxx xxx">
          <p class="hint">Not an Australian number? Add the country code, e.g. +86 …</p>
        </label>
      </div>

      <div class="step" id="step-auth" hidden>
        <p class="phone-echo"><span id="phone-echo"></span><button type="button" class="link" id="change-phone">Change</button></p>
        <label id="name-field" hidden>
          <span class="lbl">Full name</span>
          <input name="name" id="in-name" type="text" autocomplete="name" autocapitalize="words" placeholder="Your name">
        </label>
        <label>
          <span class="lbl">PIN</span>
          <input name="passcode" id="in-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="At least 4 digits">
          <p class="hint" id="pin-hint"></p>
        </label>
      </div>

      <p class="err" id="gate-err" hidden></p>
      <button type="submit" class="btn" id="gate-btn">Continue</button>
    </form>

    <p class="gate-fine" id="gate-fine">Your number is your key. First time here, we’ll ask your name and a PIN of your choosing.</p>
  </section>

  <!-- ══ INSIDE ══ -->
  <div class="inside" id="inside" hidden>
    <p class="welcome">Welcome, <em id="guest-name"></em>.</p>

    <section id="event">
      <div class="section-head">
        <div class="section-label">The Night</div>
        <h2>What to <em>expect</em></h2>
      </div>
      <p class="intro" id="ev-intro"></p>
      <div class="details">
        <div class="detail"><span class="k">When</span><span class="v" id="ev-date"></span></div>
        <div class="detail"><span class="k">Time</span><span class="v" id="ev-time"></span></div>
        <div class="detail"><span class="k">Where</span><span class="v"><a id="ev-addr" target="_blank" rel="noopener"></a></span></div>
      </div>
      <ol class="notes" id="ev-notes"></ol>
    </section>

    <section id="menu-section">
      <div class="section-head">
        <div class="section-label">Soft Opening</div>
        <h2>The <em>Menu</em></h2>
        <p class="menu-note" id="menu-note" hidden></p>
      </div>
      <div id="menu"></div>
    </section>

    <section id="about">
      <div class="section-head">
        <div class="section-label" id="about-label"></div>
        <h2 id="about-title"></h2>
      </div>
      <p class="about-body" id="about-body"></p>
    </section>

    <section id="feedback-section">
      <div class="section-head">
        <div class="section-label" id="fb-label"></div>
        <h2 id="fb-title"></h2>
      </div>
      <div id="feedback"></div>
    </section>

    <footer class="foot">
      <p class="addr" id="foot-addr"></p>
      <div class="foot-links">
        <a id="foot-mail"></a>
        <a id="foot-ig" target="_blank" rel="noopener">@jin8_bar</a>
        <button type="button" id="signout">Sign out</button>
      </div>
    </footer>
  </div>

</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var EV = window.JIN8_EVENT || 'thu';
  function api(p) { return p + (p.indexOf('?') < 0 ? '?' : '&') + 'event=' + encodeURIComponent(EV); }
  var loading = $('loading'), gate = $('gate'), inside = $('inside');
  var form = $('gate-form'), err = $('gate-err'), btn = $('gate-btn');
  var stepPhone = $('step-phone'), stepAuth = $('step-auth'), nameField = $('name-field');
  var inPhone = $('in-phone'), inName = $('in-name'), inPin = $('in-pin');
  var lede = $('gate-lede'), fine = $('gate-fine'), pinHint = $('pin-hint');

  var state = { step: 'phone', registered: false, phone: '' };
  var expiryTimer = null, expiresAt = 0;

  var COPY = {
    phoneLede: 'Enter your mobile number and we’ll open the door.',
    phoneFine: 'We recognise you by your number. First time here, we’ll ask your name and a PIN of your choosing.',
    backLede: 'Welcome back. Enter your PIN.',
    backFine: 'Forgotten your PIN? Message us at hello@jin8bar.com and we’ll reset it.',
    newLede: 'First time here. Tell us your name and choose a PIN.',
    newHint: 'At least 4 digits. You’ll use it to come back in.',
    newFine: 'We only use your number to recognise you. It won’t be shared.',
    offline: 'We couldn’t reach the door just now. Please try again.',
    expired: 'Signed out after five minutes. Enter your number to come back in.'
  };

  function show(el) { el.hidden = false; }
  function hide(el) { el.hidden = true; }
  function setErr(m) { if (m) { err.textContent = m; show(err); } else { hide(err); } }
  function busy(on, label) { btn.disabled = on; btn.textContent = label; }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function postJSON(url, body) {
    return fetch(api(url), {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); });
  }

  /* ── Gate steps ── */
  function toPhoneStep(message) {
    state.step = 'phone'; state.registered = false;
    show(stepPhone); hide(stepAuth); hide(nameField);
    inPin.value = ''; inName.value = '';
    lede.textContent = COPY.phoneLede; fine.textContent = COPY.phoneFine; pinHint.textContent = '';
    busy(false, 'Continue');
    setErr(message || '');
  }

  function toAuthStep(registered, prettyPhone) {
    state.step = 'auth'; state.registered = registered;
    hide(stepPhone); show(stepAuth);
    $('phone-echo').textContent = prettyPhone;
    if (registered) {
      hide(nameField);
      lede.textContent = COPY.backLede; pinHint.textContent = ''; fine.textContent = COPY.backFine;
      inPin.setAttribute('autocomplete', 'current-password');
    } else {
      show(nameField);
      lede.textContent = COPY.newLede; pinHint.textContent = COPY.newHint; fine.textContent = COPY.newFine;
      inPin.setAttribute('autocomplete', 'new-password');
    }
    busy(false, 'Enter'); setErr('');
    setTimeout(function () { (registered ? inPin : inName).focus(); }, 60);
  }

  function showGate(message) {
    clearTimeout(expiryTimer); expiresAt = 0;
    hide(loading); hide(inside); show(gate);
    toPhoneStep(message);
  }

  /* ── Auto sign-out (5 minutes from login, set by the server) ── */
  function expire() {
    fetch(api('/api/logout'), { method: 'POST', credentials: 'same-origin' }).catch(function () {});
    showGate(COPY.expired);
  }
  function scheduleExpiry(at) {
    clearTimeout(expiryTimer); expiresAt = at || 0;
    if (!expiresAt) return;
    var ms = expiresAt - Date.now();
    if (ms <= 0) return expire();
    expiryTimer = setTimeout(expire, Math.min(ms + 250, 2147483647));
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && expiresAt && Date.now() >= expiresAt && !inside.hidden) expire();
  });

  /* ── Accordion helper ── */
  var accGroups = {};
  function makeAcc(groupId, id, label, titleHtml, sub, innerNode) {
    var acc = el('div', 'acc'); acc.id = 'acc-' + id;
    var button = el('button', 'acc-btn'); button.type = 'button';
    button.setAttribute('aria-expanded', 'false'); button.setAttribute('aria-controls', 'panel-' + id);
    if (label) button.appendChild(el('span', 'acc-label', label));
    var t = el('span', 'acc-title'); t.innerHTML = titleHtml; button.appendChild(t);   // our own data
    if (sub) button.appendChild(el('span', 'acc-sub', sub));
    button.appendChild(el('span', 'acc-icon', '+'));
    var panel = el('div', 'acc-panel'); panel.id = 'panel-' + id;
    var inner = el('div', 'acc-inner'); inner.appendChild(innerNode); panel.appendChild(inner);
    acc.appendChild(button); acc.appendChild(panel);
    (accGroups[groupId] = accGroups[groupId] || []).push(acc);
    button.addEventListener('click', function () {
      var opening = !acc.classList.contains('open');
      accGroups[groupId].forEach(function (a) { a.classList.remove('open'); a.querySelector('.acc-btn').setAttribute('aria-expanded', 'false'); });
      if (opening) {
        acc.classList.add('open'); button.setAttribute('aria-expanded', 'true');
        setTimeout(function () { acc.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 120);
      }
    });
    return acc;
  }

  /* ── Menu ── */
  function renderItems(s) {
    var ul = el('ul', 'items' + (s.numbered ? '' : ' plain'));
    s.items.forEach(function (it) {
      var li = el('li', 'item');
      var row = el('div', 'item-row');
      if (s.numbered && it.num) row.appendChild(el('span', 'num', it.num));
      var name = el('span', 'name'); name.innerHTML = it.name;
      row.appendChild(name);
      if (!it.noPrice) row.appendChild(el('span', 'price' + (it.price ? '' : ' ph'), it.price || '—'));
      li.appendChild(row);
      if (it.cn || it.pinyin) {
        var cn = el('p', 'cn');
        if (it.cn) cn.appendChild(el('span', 'hanzi', it.cn));
        if (it.pinyin) cn.appendChild(el('span', 'pinyin', it.pinyin));
        li.appendChild(cn);
      }
      if (it.tag) li.appendChild(el('p', 'tag', it.tag));
      if (it.desc) li.appendChild(el('p', 'desc', it.desc));
      if (it.pour) li.appendChild(el('p', 'pour', it.pour));
      if (it.strength) li.appendChild(el('p', 'strength', it.strength));
      ul.appendChild(li);
    });
    return ul;
  }

  function renderMenu(menu) {
    var note = $('menu-note');
    if (menu.note) { note.textContent = menu.note; show(note); } else { hide(note); }
    var root = $('menu'); root.textContent = '';
    accGroups.menu = [];
    var wrap = el('div', 'acc-list');
    (menu.sections || []).forEach(function (s) {
      var groups = (s.groups || []).filter(function (g) { return g.items && g.items.length; });
      var body;
      if (groups.length) {
        body = el('div');
        groups.forEach(function (g) {
          body.appendChild(el('p', 'group-title', g.title));
          body.appendChild(renderItems({ numbered: false, items: g.items }));
        });
      } else if (s.items && s.items.length) {
        body = renderItems(s);
      } else {
        body = el('p', 'placeholder', s.placeholder || 'Coming soon.');
      }
      wrap.appendChild(makeAcc('menu', s.id, s.label, s.title, s.sub, body));
    });
    root.appendChild(wrap);
  }

  /* ── Feedback ── */
  function renderFeedback(fb, existing) {
    $('fb-label').textContent = fb.label || '';
    $('fb-title').innerHTML = fb.title || '';
    var root = $('feedback'); root.textContent = '';
    accGroups.feedback = [];
    var wrap = el('div', 'acc-list');
    var body;

    if (!fb.open) {
      body = el('p', 'placeholder', fb.closedText || ('Feedback opens on ' + fb.opensOn + '.'));
    } else {
      body = el('div');
      var thanks = el('p', 'fb-thanks', fb.thanks || 'Thank you.');
      var again = el('button', 'fb-again', 'Change your answers'); again.type = 'button';
      var f = el('form', 'fb-form'); f.noValidate = true;
      var ratings = {};

      (fb.areas || []).forEach(function (a) {
        var fs = el('fieldset', 'fb-area');
        fs.appendChild(el('div', 'fb-title', a.title));
        if (a.sub) fs.appendChild(el('div', 'fb-sub', a.sub));
        fs.appendChild(el('div', 'rating-hint', '1 = not for me · 5 = loved it'));
        var rg = el('div', 'rating'); rg.setAttribute('role', 'radiogroup'); rg.setAttribute('aria-label', a.title);
        ratings[a.id] = existing && existing[a.id] ? existing[a.id].rating : null;
        for (var v = 1; v <= 5; v++) (function (val) {
          var b = el('button', 'rate' + (ratings[a.id] === val ? ' on' : ''), String(val)); b.type = 'button';
          b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', ratings[a.id] === val ? 'true' : 'false');
          b.addEventListener('click', function () {
            ratings[a.id] = ratings[a.id] === val ? null : val;
            Array.prototype.forEach.call(rg.children, function (c, i) {
              var on = ratings[a.id] === i + 1; c.classList.toggle('on', on); c.setAttribute('aria-checked', on ? 'true' : 'false');
            });
          });
          rg.appendChild(b);
        })(v);
        fs.appendChild(rg);
        var ta = el('textarea'); ta.name = a.id; ta.placeholder = a.prompt || ''; ta.rows = 2;
        if (existing && existing[a.id] && existing[a.id].note) ta.value = existing[a.id].note;
        fs.appendChild(ta);
        f.appendChild(fs);
      });

      var other = el('div', 'fb-other');
      other.appendChild(el('div', 'fb-title', fb.otherPrompt || 'Anything else?'));
      var to = el('textarea'); to.name = 'other'; to.placeholder = 'Whatever’s on your mind.'; to.rows = 3;
      if (existing && existing.other) to.value = existing.other;
      other.appendChild(to); f.appendChild(other);

      var ferr = el('p', 'err'); ferr.hidden = true; f.appendChild(ferr);
      var send = el('button', 'btn', existing ? 'Update feedback' : 'Send feedback'); send.type = 'submit'; f.appendChild(send);

      f.addEventListener('submit', function (e) {
        e.preventDefault(); ferr.hidden = true;
        var payload = { other: to.value };
        (fb.areas || []).forEach(function (a) { payload[a.id] = { rating: ratings[a.id], note: f.querySelector('textarea[name="' + a.id + '"]').value }; });
        send.disabled = true; send.textContent = 'Sending…';
        postJSON('/api/feedback', payload).then(function (res) {
          send.disabled = false; send.textContent = 'Update feedback';
          if (!res.ok) { ferr.textContent = res.body.error || 'Something went wrong.'; ferr.hidden = false; return; }
          f.hidden = true; thanks.hidden = false; again.hidden = false;
        }).catch(function () { send.disabled = false; send.textContent = 'Send feedback'; ferr.textContent = COPY.offline; ferr.hidden = false; });
      });
      again.addEventListener('click', function () { f.hidden = false; thanks.hidden = true; again.hidden = true; });

      if (existing) { f.hidden = true; } else { thanks.hidden = true; again.hidden = true; }
      body.appendChild(thanks); body.appendChild(again); body.appendChild(f);
    }

    wrap.appendChild(makeAcc('feedback', 'feedback', null, fb.button || 'Leave feedback', fb.open ? null : ('Opens ' + fb.opensOn), body));
    root.appendChild(wrap);
  }

  /* ── Inside ── */
  function renderInside(data) {
    var ev = data.event, g = data.guest, ab = data.about || {};
    $('guest-name').textContent = (g.name || '').split(' ')[0] || 'friend';
    if (ev.kicker) $('kicker').textContent = ev.kicker;
    $('ev-intro').textContent = ev.intro || '';
    $('ev-date').textContent = ev.date || '';
    $('ev-time').textContent = ev.time || '';
    var addr = $('ev-addr'); addr.textContent = ev.address || ''; addr.href = ev.mapsUrl || '#';
    var notes = $('ev-notes'); notes.textContent = '';
    (ev.notes || []).forEach(function (n) { notes.appendChild(el('li', null, n)); });
    $('about-label').textContent = ab.label || ''; $('about-title').innerHTML = ab.title || ''; $('about-body').textContent = ab.body || '';
    $('foot-addr').textContent = ev.address || '';
    var mail = $('foot-mail'); mail.textContent = ev.contact || ''; mail.href = 'mailto:' + (ev.contact || '');
    if (ev.instagram) $('foot-ig').href = ev.instagram;
    renderMenu(data.menu || {});
    renderFeedback(data.feedback || {}, g.feedback || null);
    hide(loading); hide(gate); show(inside);
    window.scrollTo({ top: 0, behavior: 'instant' });
    scheduleExpiry(data.session && data.session.expiresAt);
  }

  function load() {
    return fetch(api('/api/content'), { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json().then(renderInside) : showGate(); })
      .catch(function () { showGate(COPY.offline); });
  }

  /* ── Gate form ── */
  form.addEventListener('submit', function (e) {
    e.preventDefault(); setErr('');

    if (state.step === 'phone') {
      var phone = inPhone.value.trim();
      if (!phone) { setErr('Please enter your mobile number.'); return; }
      busy(true, 'One moment…');
      postJSON('/api/lookup', { phone: phone }).then(function (res) {
        if (!res.ok) { busy(false, 'Continue'); setErr(res.body.error || 'Something went wrong.'); return; }
        state.phone = phone;
        toAuthStep(!!res.body.registered, res.body.phone);
      }).catch(function () { busy(false, 'Continue'); setErr(COPY.offline); });
      return;
    }

    var pin = inPin.value;
    if (pin.length < 4) { setErr('PIN needs to be at least 4 characters.'); return; }
    if (!state.registered && inName.value.trim().length < 2) { setErr('Please enter your full name.'); return; }
    busy(true, 'One moment…');
    postJSON('/api/auth', { name: inName.value, phone: state.phone, passcode: pin }).then(function (res) {
      if (!res.ok) { busy(false, 'Enter'); setErr(res.body.error || 'Something went wrong.'); return; }
      inPin.value = ''; inName.value = '';
      return load();
    }).catch(function () { busy(false, 'Enter'); setErr(COPY.offline); });
  });

  $('change-phone').addEventListener('click', function () { toPhoneStep(); inPhone.focus(); });

  $('signout').addEventListener('click', function () {
    clearTimeout(expiryTimer); expiresAt = 0;
    fetch(api('/api/logout'), { method: 'POST', credentials: 'same-origin' }).finally(function () { showGate(); });
  });

  load();
})();
</script>
</body>
</html>
