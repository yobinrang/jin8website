<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jin 8 — Menu</title>
<meta name="description" content="The Jin 8 soft opening menu. Box Hill, Victoria.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a0606">
<link rel="icon" type="image/png" sizes="512x512" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cormorant+SC:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF0C8;
    --gold: #C9A961;
    --rule: rgba(201, 169, 97, 0.18);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    background: #2a0606;
    color: var(--cream);
    font-family: 'EB Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* The bar itself, sitting behind the top of the page */
  .backdrop {
    position: fixed; inset: 0 0 auto 0; height: 78vh; z-index: 0;
    background-image: url('../assets/bar-interior.jpg');
    background-size: cover; background-position: center 55%;
    opacity: 0; transform: scale(1.08);
    animation: backdropIn 2.6s 0.25s var(--ease) forwards;
  }
  .backdrop::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 26%, rgba(139,0,0,0.34) 0%, transparent 62%),
      linear-gradient(180deg, rgba(26,3,3,0.72) 0%, rgba(42,6,6,0.5) 40%, #2a0606 100%);
  }
  @keyframes backdropIn { to { opacity: 0.5; transform: scale(1); } }

  .grain {
    position: fixed; inset: 0; z-index: 90; pointer-events: none; mix-blend-mode: overlay; opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  }

  .page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 0 24px 80px; }

  /* ── CURTAIN: covers the page, lifts once the menu is ready ── */
  .curtain {
    position: fixed; inset: 0; z-index: 120; background: #1d0404;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.9s var(--ease), visibility 0.9s;
  }
  .curtain.lift { opacity: 0; visibility: hidden; }
  .curtain .seal {
    width: 96px; height: auto;
    animation: sealIn 1.5s var(--ease) both, sealPulse 2.6s 1.3s ease-in-out infinite;
    filter: drop-shadow(0 0 26px rgba(255,200,100,0.34));
  }
  @keyframes sealIn { from { opacity: 0; transform: translateY(14px) scale(0.94); } to { opacity: 1; transform: none; } }
  @keyframes sealPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* ── HEADER ── */
  .head { text-align: center; padding: 64px 0 34px; }
  .logo {
    width: 92px; height: auto; display: block; margin: 0 auto 26px;
    filter: drop-shadow(0 0 20px rgba(255,200,100,0.3)) drop-shadow(0 6px 16px rgba(0,0,0,0.5));
  }
  .kicker {
    font-family: 'Cormorant SC', serif; font-size: 10.5px; letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--gold); opacity: 0.88; display: inline-flex; align-items: center; gap: 14px; margin-bottom: 16px;
  }
  .kicker::before, .kicker::after { content: ''; width: 22px; height: 1px; background: var(--gold); opacity: 0.5; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(44px, 13vw, 62px); font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  h1 em { font-style: italic; color: var(--gold); }
  .sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; opacity: 0.7; margin-top: 14px; }
  .deal {
    display: inline-block; margin-top: 22px; padding: 10px 18px;
    border: 1px solid rgba(201,169,97,0.42); border-radius: 2px;
    font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.26em;
    text-transform: uppercase; color: var(--gold); line-height: 1.6;
  }

  /* ── JUMP NAV ── */
  .jump {
    position: sticky; top: 0; z-index: 60; display: flex; justify-content: center; gap: 4px;
    padding: 12px 0; margin-bottom: 8px;
    background: linear-gradient(180deg, #2a0606 72%, rgba(42,6,6,0));
    backdrop-filter: blur(6px);
  }
  .jump a {
    font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--cream); opacity: 0.55; text-decoration: none; padding: 7px 12px;
    border: 1px solid transparent; border-radius: 2px; transition: all 0.25s; white-space: nowrap;
  }
  .jump a:hover, .jump a.on { opacity: 1; color: var(--gold); border-color: rgba(201,169,97,0.4); }

  /* ── SECTIONS ── */
  section { padding-top: 26px; scroll-margin-top: 58px; }
  .section-head { text-align: center; margin-bottom: 4px; }
  .section-label {
    font-family: 'Cormorant SC', serif; font-size: 9.5px; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold); opacity: 0.8; display: inline-flex; align-items: center; gap: 12px; margin-bottom: 8px;
  }
  .section-label::before, .section-label::after { content: ''; width: 16px; height: 1px; background: var(--gold); opacity: 0.5; }
  .section-head h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; line-height: 1.05; }
  .section-head h2 em { font-style: italic; color: var(--gold); }
  .section-head .ssub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14.5px; opacity: 0.6; margin-top: 6px; }

  .price-header {
    text-align: right; font-family: 'Cormorant SC', serif; font-size: 9px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--gold); opacity: 0.75; padding: 20px 0 0;
    border-top: 1px solid var(--rule); margin-top: 18px;
  }
  .group-title {
    font-family: 'Cormorant SC', serif; font-size: 9.5px; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--gold); opacity: 0.8; padding: 24px 0 4px; border-top: 1px solid var(--rule);
  }
  .price-header + .items, .price-header + .group-title, .group-title + .items { border-top: none; }

  .items { list-style: none; border-top: 1px solid var(--rule); }
  .item { padding: 20px 0 18px; border-bottom: 1px solid var(--rule); }
  .item:last-child { border-bottom: none; }
  .item-row { display: flex; align-items: baseline; gap: 12px; }
  .num { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 11.5px; opacity: 0.4; flex: 0 0 auto; min-width: 19px; }
  .name { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; line-height: 1.15; flex: 1 1 auto; }
  .was { font-family: 'Cormorant Garamond', serif; font-size: 14px; opacity: 0.4; text-decoration: line-through; flex: 0 0 auto; white-space: nowrap; }
  .price { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--gold); flex: 0 0 auto; white-space: nowrap; margin-left: 8px; }
  .cn { margin-top: 4px; padding-left: 31px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; color: var(--gold); }
  .cn .hanzi { font-family: 'Noto Serif SC', serif; font-size: 16px; letter-spacing: 0.08em; }
  .cn .pinyin { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14.5px; opacity: 0.75; }
  .tag { margin-top: 9px; padding-left: 31px; font-family: 'Cormorant SC', serif; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); opacity: 0.6; }
  .desc { margin-top: 5px; padding-left: 31px; font-size: 14.5px; line-height: 1.6; opacity: 0.74; }
  .pour { margin-top: 6px; padding-left: 31px; font-size: 14px; line-height: 1.55; font-style: italic; opacity: 0.6; }
  .strength { margin-top: 8px; padding-left: 31px; font-family: 'Cormorant SC', serif; font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); opacity: 0.58; }
  .items.plain .cn, .items.plain .tag, .items.plain .desc, .items.plain .pour, .items.plain .strength { padding-left: 0; }

  /* ── FOOTER ── */
  .foot { text-align: center; margin-top: 56px; padding-top: 30px; border-top: 1px solid var(--rule); }
  .foot .card {
    font-family: 'Cormorant SC', serif; font-size: 10.5px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--gold); opacity: 0.85; margin-bottom: 16px;
  }
  .foot .food { font-size: 14.5px; font-style: italic; opacity: 0.62; line-height: 1.55; max-width: 380px; margin: 0 auto 20px; }
  .foot .addr { font-size: 13px; font-style: italic; opacity: 0.42; line-height: 1.6; }
  .foot a {
    display: inline-block; margin-top: 14px; color: var(--cream); opacity: 0.55; text-decoration: none;
    font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    border-bottom: 1px solid transparent; transition: all 0.25s;
  }
  .foot a:hover { color: var(--gold); opacity: 1; border-bottom-color: var(--gold); }

  .loading { text-align: center; padding: 60px 0; font-family: 'Cormorant SC', serif; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); opacity: 0.5; }
  [hidden] { display: none !important; }

  /* ── ENTRANCE ── */
  .rise { opacity: 0; transform: translateY(22px); }
  .rise.in { opacity: 1; transform: none; transition: opacity 0.85s var(--ease), transform 0.85s var(--ease); }

  @media (prefers-reduced-motion: reduce) {
    .backdrop { animation: none; opacity: 0.5; transform: none; }
    .curtain .seal { animation: none; }
    .rise, .rise.in { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="curtain" id="curtain" aria-hidden="true">
  <img class="seal" src="../assets/jin8-logo-royal.png" alt="">
</div>

<div class="page">
  <header class="head">
    <img class="logo rise" src="../assets/jin8-logo-royal.png" alt="Jin 8">
    <div class="kicker rise" id="kicker"></div>
    <h1 class="rise" id="title"></h1>
    <p class="sub rise" id="sub"></p>
    <p class="deal rise" id="deal" hidden></p>
  </header>

  <nav class="jump rise" id="jump" hidden></nav>

  <p class="loading" id="loading">Pouring…</p>
  <div id="menu"></div>

  <footer class="foot rise" id="foot" hidden>
    <p class="card" id="f-card"></p>
    <p class="food" id="f-food"></p>
    <p class="addr" id="f-addr"></p>
    <a id="f-ig" target="_blank" rel="noopener"></a>
  </footer>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // Reveal elements as they scroll in, and stagger anything already on screen.
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var i = Number(en.target.getAttribute('data-stagger') || 0);
      setTimeout(function () { en.target.classList.add('in'); }, reduce ? 0 : i * 70);
      io.unobserve(en.target);
    });
  }, { threshold: 0.06, rootMargin: '0px 0px -8% 0px' }) : null;

  function watch(nodes) {
    nodes.forEach(function (n, i) {
      n.setAttribute('data-stagger', Math.min(i, 6));
      if (io) io.observe(n); else n.classList.add('in');
    });
  }

  function renderItems(s) {
    var ul = el('ul', 'items' + (s.numbered ? '' : ' plain'));
    (s.items || []).forEach(function (it) {
      var li = el('li', 'item rise');
      var row = el('div', 'item-row');
      if (s.numbered && it.num) row.appendChild(el('span', 'num', it.num));
      var name = el('span', 'name'); name.innerHTML = it.name; row.appendChild(name);
      if (it.was) row.appendChild(el('span', 'was', it.was));
      if (it.price) row.appendChild(el('span', 'price', it.price));
      li.appendChild(row);
      if (it.cn || it.pinyin) {
        var cn = el('p', 'cn');
        if (it.cn) cn.appendChild(el('span', 'hanzi', it.cn));
        if (it.pinyin) cn.appendChild(el('span', 'pinyin', it.pinyin));
        li.appendChild(cn);
      }
      if (it.tag) li.appendChild(el('p', 'tag', it.tag));
      if (it.desc) li.appendChild(el('p', 'desc', it.desc));
      if (it.pour) li.appendChild(el('p', 'pour', it.pour));
      if (it.strength) li.appendChild(el('p', 'strength', it.strength));
      ul.appendChild(li);
    });
    return ul;
  }

  function render(data) {
    var m = data.menu, h = data.header, f = data.footer;

    $('kicker').textContent = h.kicker;
    $('title').innerHTML = h.title;
    $('sub').textContent = h.sub;
    if (m.note) { $('deal').textContent = m.note; $('deal').hidden = false; }

    var jump = $('jump'); jump.textContent = '';
    var root = $('menu'); root.textContent = '';

    (m.sections || []).forEach(function (s) {
      var a = el('a', null, s.title.replace(/<[^>]+>/g, ''));
      a.href = '#sec-' + s.id; a.setAttribute('data-sec', 'sec-' + s.id);
      jump.appendChild(a);

      var sec = el('section'); sec.id = 'sec-' + s.id;
      var head = el('div', 'section-head rise');
      if (s.label) head.appendChild(el('div', 'section-label', s.label));
      var h2 = el('h2'); h2.innerHTML = s.title; head.appendChild(h2);
      if (s.sub) head.appendChild(el('p', 'ssub', s.sub));
      sec.appendChild(head);

      if (m.priceHeader) sec.appendChild(el('p', 'price-header rise', m.priceHeader));

      var groups = (s.groups || []).filter(function (g) { return g.items && g.items.length; });
      if (groups.length) {
        groups.forEach(function (g) {
          sec.appendChild(el('p', 'group-title rise', g.title));
          sec.appendChild(renderItems({ numbered: false, items: g.items }));
        });
      } else {
        sec.appendChild(renderItems(s));
      }
      root.appendChild(sec);
    });

    $('f-card').textContent = f.card;
    $('f-food').textContent = f.food;
    $('f-addr').textContent = f.address;
    var ig = $('f-ig'); ig.textContent = f.handle; ig.href = f.instagram;

    $('loading').hidden = true;
    jump.hidden = false;
    $('foot').hidden = false;

    // Lift the curtain, then let the page arrive a piece at a time.
    requestAnimationFrame(function () {
      setTimeout(function () { $('curtain').classList.add('lift'); }, reduce ? 0 : 520);
      var header = [].slice.call(document.querySelectorAll('.head .rise'));
      header.forEach(function (n, i) {
        setTimeout(function () { n.classList.add('in'); }, reduce ? 0 : 700 + i * 110);
      });
      setTimeout(function () { jump.classList.add('in'); }, reduce ? 0 : 1180);
      watch([].slice.call(document.querySelectorAll('#menu .rise')));
      watch([$('foot')]);
      spy();
    });
  }

  // Highlight the section you're reading in the jump bar.
  function spy() {
    var links = [].slice.call(document.querySelectorAll('.jump a'));
    if (!links.length || !('IntersectionObserver' in window)) return;
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (l) { l.classList.toggle('on', l.getAttribute('data-sec') === en.target.id); });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    links.forEach(function (l) {
      var sec = document.getElementById(l.getAttribute('data-sec'));
      if (sec) obs.observe(sec);
    });
  }

  fetch('/api/menu', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () {
      $('curtain').classList.add('lift');
      $('loading').textContent = 'The menu is having a moment. Please ask the team.';
    });
})();
</script>
</body>
</html>
