# Netlify deploy config — static site at repo root + serverless functions.
# No build command; Netlify installs package.json deps for the functions.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /menu is INACTIVE during the soft opening: bounce to the Coming Soon page.
# The menu lives inside the gated invitation for now. Delete these two
# redirect blocks at full launch to make /menu (and the printed QR) live.
[[redirects]]
  from = "/menu"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/menu/*"
  to = "/"
  status = 302
  force = true

# The invitation used to live at the long hex address; keep it working.
[[redirects]]
  from = "/soft-opening-bb877a1e5e6b/*"
  to = "/softopen/:splat"
  status = 301

# The admin page used to live at a hex address; keep old bookmarks working.
[[redirects]]
  from = "/admin-7d4a853713e1/*"
  to = "/softopen_admin/:splat"
  status = 301

# Saturday's invitation is the same page as Thursday's; the page reads its
# own address to know which night it is.
[[redirects]]
  from = "/softopen_sat"
  to = "/softopen/index.html"
  status = 200

[[redirects]]
  from = "/softopen_sat/*"
  to = "/softopen/index.html"
  status = 200

# Secret pages: never indexed, never cached.
[[headers]]
  for = "/softopen/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/softopen_admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/softopen_sat"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/softopen_sat/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Cache static assets aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
