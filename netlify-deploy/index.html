<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jin 8 — An Oriental Bar · Box Hill</title>
<meta name="description" content="Jin 8 — an oriental cocktail bar opening soon in Box Hill, Victoria. An ode to the merchants of old Shanxi.">
<meta name="theme-color" content="#420606">
<meta property="og:title" content="Jin 8 — Coming Soon">
<meta property="og:description" content="A quiet door, opening soon. An oriental cocktail bar in Box Hill.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jin8bar.com/">
<meta property="og:image" content="https://jin8bar.com/assets/ancient-city.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://jin8bar.com/">
<link rel="icon" type="image/png" href="assets/jin8-logo-cropped.png">
<link rel="apple-touch-icon" href="assets/jin8-logo-cropped.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+SC:wght@300;400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --crimson: #8B0000;
    --crimson-deep: #4a0202;
    --cream: #FAF0C8;
    --gold: #C9A961;
  }

  html, body { height: 100%; }

  body {
    font-family: 'EB Garamond', serif;
    color: var(--cream);
    background: #420606;
    overflow: hidden;
    position: relative;
  }

  /* Grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    z-index: 100;
    mix-blend-mode: overlay;
  }

  .stage {
    position: fixed;
    inset: 0;
    background: #2a0606;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 40px;
    z-index: 1;
  }

  /* Real photo backdrop */
  .city-backdrop {
    position: absolute;
    inset: 0;
    background-image: url('assets/ancient-city.webp');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.6;
    filter: saturate(1.1) contrast(1.05) brightness(0.95);
    z-index: 1;
    pointer-events: none;
    animation: cityIn 2.4s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  }

  /* Crimson tint + vignette over photo */
  .stage::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(100, 16, 16, 0.32) 0%, rgba(25, 4, 4, 0.78) 100%),
      linear-gradient(180deg, rgba(70, 8, 8, 0.3) 0%, rgba(40, 5, 5, 0.5) 50%, rgba(15, 2, 2, 0.85) 100%);
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 2;
  }

  /* Extra crimson wash for brand cohesion */
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 35%, rgba(139, 0, 0, 0.35) 0%, transparent 65%);
    z-index: 2;
    pointer-events: none;
  }

  /* ── Content ── */
  .content {
    position: relative;
    z-index: 3;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 540px;
  }

  .logo-wrap {
    position: relative;
    margin-bottom: 56px;
    animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    display: inline-block;
    width: 116px;
  }

  .logo {
    width: 116px;
    height: auto;
    display: block;
    filter:
      drop-shadow(0 0 22px rgba(255, 200, 100, 0.32))
      drop-shadow(0 4px 16px rgba(0, 0, 0, 0.45));
  }

  .kicker {
    font-family: 'Cormorant SC', serif;
    font-size: 11px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
    margin-bottom: 28px;
    animation: fadeUp 1.4s 0.3s cubic-bezier(0.16,1,0.3,1) both;
    display: inline-flex;
    align-items: center;
    gap: 16px;
  }

  .kicker::before,
  .kicker::after {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--gold);
    opacity: 0.5;
  }

  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(48px, 7vw, 88px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.015em;
    color: var(--cream);
    animation: fadeUp 1.6s 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }

  .headline em {
    font-style: italic;
    color: var(--gold);
    font-weight: 300;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(15px, 1.5vw, 18px);
    color: var(--cream);
    opacity: 0.7;
    margin-top: 32px;
    line-height: 1.6;
    animation: fadeUp 1.4s 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  /* Contact links */
  .links {
    margin-top: 64px;
    display: flex;
    gap: 28px;
    align-items: center;
    animation: fadeUp 1.4s 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }

  .links a {
    font-family: 'Cormorant SC', serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--cream);
    text-decoration: none;
    opacity: 0.8;
    transition: color 0.25s, opacity 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px;
    border-bottom: 1px solid transparent;
  }

  .links a:hover {
    color: var(--gold);
    opacity: 1;
    border-bottom-color: var(--gold);
  }

  .links .sep {
    width: 4px;
    height: 4px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0.4;
  }

  .icon {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.4;
  }

  /* Bottom marker */
  .footer-mark {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 3;
    font-family: 'Cormorant SC', serif;
    font-size: 9px;
    letter-spacing: 0.4em;
    padding-left: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.45;
    animation: fadeUp 1.4s 1.1s cubic-bezier(0.16,1,0.3,1) both;
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes cityIn {
    from { opacity: 0; transform: scale(1.06); }
    to   { opacity: 0.55; transform: scale(1); }
  }

  @media (max-width: 600px) {
    .stage { padding: 32px 22px; }
    .logo { width: 92px; }
    .logo-wrap { margin-bottom: 44px; width: 92px; }
    .links { flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 44px; }
    .links .sep { display: none; }
    .city-backdrop { opacity: 0.45; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="city-backdrop"></div>

  <div class="content">
    <div class="logo-wrap">
      <img class="logo" src="assets/jin8-logo-royal.png" alt="Jin 8">
    </div>
    <div class="kicker">Jin 8 · An Oriental Bar</div>
    <h1 class="headline">A quiet door,<br>opening <em>soon</em>.</h1>
    <p class="tagline">Box Hill VIC</p>

    <div class="links">
      <a href="https://www.instagram.com/jin8_bar/" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        Instagram
      </a>
      <span class="sep"></span>
      <a href="mailto:hello@jin8bar.com">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 7l9 6 9-6"/></svg>
        Contact Us
      </a>
    </div>
  </div>

  <div class="footer-mark">An ode to the merchants of old</div>
</div>

</body>
</html>
